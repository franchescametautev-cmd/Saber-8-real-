<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SABER 8</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
              <a href="index.html">  
                <img src="../styles/Logo.png" alt="SABER 8" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
              </a>
                <div class="logo-placeholder">S8</div>
            </div>

            <div class="nav-buttons">
                <a href="register.html" class="btn-register">Regístrate</a>
            </div>
        </div>
    </header>


    <div class="container">
        <div class="auth-card">
            <h1>Iniciar Sesión</h1>
            <h2>SABER 8</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Nombre de Usuario" required>
                </div>


                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>


                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="btn-submit">Ingresar</button>

                <p class="switch-link">
                    ¿Aún no tienes cuenta? 
                    <a href="register.html">Regístrate</a> para empezar.
                </p>
            </form>
        </div>
    </div>


    <script src="../CSS/login.js"></script>
</body>
</html>
