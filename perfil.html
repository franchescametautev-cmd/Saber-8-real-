<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil</title>
  <link rel="stylesheet" href="../CSS/Dashboard.css">
  <link rel="stylesheet" href="../CSS/perfil.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <div class="app-shell">

    <nav class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-logo">
      <a href="../Html/Dashboard.html"><img src="../styles/Logo.png" alt="Logo" class="sidebar-logo-img"></a>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">
      <i class="bi bi-list"></i>
    </button>
  </div>

      <ul class="sidebar-nav">
        <li class="sidebar-item">
          <a href="#" class="sidebar-link">
            <i class="bi bi-controller sidebar-icon"></i>
            <span class="sidebar-label">Videojuegos</span>
            <i class="bi bi-chevron-down sidebar-caret"></i>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" class="sidebar-link">
            <i class="bi bi-play-circle sidebar-icon"></i>
            <span class="sidebar-label">Videos</span>
            <i class="bi bi-chevron-down sidebar-caret"></i>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" class="sidebar-link">
            <i class="bi bi-file-earmark-text sidebar-icon"></i>
            <span class="sidebar-label">Talleres</span>
            <i class="bi bi-chevron-down sidebar-caret"></i>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="../Html/Miprogreso.html" class="sidebar-link">
            <i class="bi bi-bar-chart-line sidebar-icon"></i>
            <span class="sidebar-label">Progreso</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" class="sidebar-link">
            <i class="bi bi-chat-dots sidebar-icon"></i>
            <span class="sidebar-label">Comentarios</span>
            <i class="bi bi-chevron-down sidebar-caret"></i>
          </a>
        </li>
      </ul>

      <div class="sidebar-profile">
        <a href="../Html/perfil.html" class="sidebar-link">
          <i class="bi bi-person-circle sidebar-icon"></i>
          <span class="sidebar-label">Nombre</span>
        </a>
      </div>
    </nav>

    <div class="main-content">
      <header class="topbar">
        <a class="topbar__link" href="#">Ayuda</a>
        <button class="btn btn--outline" type="submit" form="perfil-form">Guardar Cambios</button>
      </header>

      <main class="page">
        <h1 class="page__title">Tu Perfil</h1>

        <section class="card">
          <form id="perfil-form" class="perfil" novalidate>

            <div class="perfil__top">
              <img class="avatar" src="../styles/foto.png" alt="Foto de perfil">

              <div class="field perfil__name">
                <label class="field__label" for="nombre">Nombre:</label>
                <input class="field__input" id="nombre" name="nombre" type="text" placeholder="Nombre" autocomplete="name">
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="usuario">Nombre de Usuario:</label>
              <input class="field__input" id="usuario" name="usuario" type="text" placeholder="Usuario" autocomplete="username">
            </div>

            <div class="field">
              <label class="field__label" for="correo">Correo Electrónico:</label>
              <input class="field__input" id="correo" name="correo" type="email" placeholder="Correo Electrónico" autocomplete="email">
            </div>

            <div class="field">
              <label class="field__label" for="password">Contraseña:</label>
              <input class="field__input" id="password" name="password" type="password" placeholder="Contraseña" autocomplete="new-password">
            </div>

            <div class="perfil__actions">
              <button class="btn btn--block" type="button" id="btn-logout">Cerrar Sesión</button>
              <button class="btn btn--block" type="button" id="btn-delete">Borrar Cuenta</button>
            </div>

          </form>
        </section>
      </main>
    </div>

  </div>

  <script src="../JS/perfil.js"></script>
</body>
</html>
